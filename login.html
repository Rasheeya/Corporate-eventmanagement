<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="STACKLY - Login to your corporate event management portal. View live reporting, SLA dashboards, and account activity.">
  <title>Login | STACKLY Corporate Event Management</title>
  <link rel="icon" type="image/webp" href="assets/logo.webp">
  
  <!-- Google Fonts: Bebas Neue, Oswald, Inter, Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/style.css?v=6.2">
  <link rel="stylesheet" href="css/login.css?v=6.2">
</head>
<body data-page="login">

  <!-- Site Preloader Animation -->
  <div class="site-preloader" id="sitePreloader" aria-hidden="true">
    <div class="preloader-inner">
      <div class="preloader-emblem-wrap">
        <div class="preloader-ring"></div>
        <div class="preloader-ring preloader-ring-pulse"></div>
        <img src="assets/logo.webp" alt="STACKLY" class="preloader-logo">
      </div>
      <div class="preloader-brand">STACKLY</div>
      <div class="preloader-bar-track">
        <div class="preloader-bar-fill"></div>
      </div>
      <span class="preloader-tagline">EXPERIENCE EXCEPTIONAL</span>
    </div>
  </div>

  <!-- Ambient Light Sparkle Canvas -->
  <canvas class="auth-ambient-canvas" id="authAmbientCanvas"></canvas>

  <main class="auth-page-wrapper">
    <div class="auth-card-container" data-reveal="fade-up">
      
      <!-- ==================== LEFT COLUMN: MEDIA HERO CARD ==================== -->
      <div class="auth-media-card" id="authMediaCard">
        <div class="auth-media-bg-wrap">
          <img src="assets/login-hero-badges.webp" alt="Event coordinator organizing conference attendee badges" class="auth-media-img">
          <div class="auth-media-overlay"></div>
          <div class="auth-media-shimmer"></div>
        </div>

        <div class="auth-media-content">
          <h1 class="auth-media-title">
            <span class="auth-title-line highlight-orange text-shimmer-sweep">WELCOME</span>
            <span class="auth-title-line highlight-orange text-shimmer-sweep">BACK</span>
          </h1>
          <p class="auth-media-desc">
            Log in to view live reporting, SLA dashboards, and your account's activity.
          </p>
          <div class="auth-media-action">
            <a href="index.html" class="btn btn-orange btn-pill auth-back-home-btn">
              <i class="fa-solid fa-arrow-left"></i>
              <span>Back to home</span>
            </a>
          </div>
        </div>
      </div>

      <!-- ==================== RIGHT COLUMN: LOGIN FORM ==================== -->
      <div class="auth-form-col">
        <div class="auth-form-inner">
          
          <!-- Top Brand Logo -->
          <div class="auth-brand-wrap">
            <a href="index.html" class="auth-brand-logo" aria-label="STACKLY Home">
              <img src="assets/logo.webp" alt="STACKLY" class="auth-brand-logo-img">
            </a>
          </div>

          <!-- Form Title -->
          <h2 class="auth-heading">Login</h2>

          <!-- Main Login Form -->
          <form class="auth-form" id="loginForm" novalidate>
            
            <!-- Dropdown Field: Select Role -->
            <div class="auth-field-group">
              <label for="loginRole" class="auth-label">Select Role</label>
              <div class="auth-input-wrap auth-select-wrap">
                <select id="loginRole" class="auth-input auth-select" required aria-required="true">
                  <option value="" disabled selected hidden>Select your role</option>
                  <option value="user">User</option>
                  <option value="admin">Admin</option>
                </select>
                <div class="auth-select-arrow" aria-hidden="true">
                  <i class="fa-solid fa-chevron-down"></i>
                </div>
              </div>
            </div>

            <!-- Input Field: Email -->
            <div class="auth-field-group">
              <label for="loginEmail" class="auth-label">Email ID</label>
              <div class="auth-input-wrap">
                <input type="email" id="loginEmail" class="auth-input" placeholder="Enter your email" required autocomplete="email">
              </div>
            </div>

            <!-- Input Field: Password -->
            <div class="auth-field-group">
              <label for="loginPassword" class="auth-label">Password</label>
              <div class="auth-input-wrap">
                <input type="password" id="loginPassword" class="auth-input" placeholder="Enter your password" required autocomplete="current-password">
                <button type="button" class="auth-pwd-toggle" id="pwdToggle" aria-label="Toggle password visibility">
                  <i class="fa-regular fa-eye"></i>
                </button>
              </div>
            </div>

            <!-- Meta Row: Remember Me & Forgot Password -->
            <div class="auth-meta-row">
              <label class="auth-checkbox-label">
                <input type="checkbox" id="rememberMe" class="auth-checkbox">
                <span class="auth-checkbox-custom"></span>
                <span class="auth-checkbox-text">Remember me</span>
              </label>
              <a href="#" class="auth-forgot-link" id="forgotPwdLink">Forgot password?</a>
            </div>

            <!-- Submit CTA -->
            <div class="auth-submit-wrap">
              <button type="submit" class="btn btn-orange btn-pill auth-submit-btn" id="loginSubmitBtn">
                <span>Login</span>
              </button>
            </div>

            <!-- Signup Callout -->
            <div class="auth-switch-prompt">
              <span>I don't have account</span>
              <a href="signup.html" class="auth-switch-link">Signup</a>
            </div>

            <!-- Divider -->
            <div class="auth-divider">
              <span class="auth-divider-text">Or continue with</span>
            </div>

            <!-- Social Logins -->
            <div class="auth-social-buttons">
              <!-- Apple Login -->
              <button type="button" class="btn auth-social-btn btn-social-apple" onclick="window.handleSocialLogin('Apple')">
                <i class="fa-brands fa-apple social-icon"></i>
                <span>Login with Apple</span>
              </button>

              <!-- Google Login -->
              <button type="button" class="btn auth-social-btn btn-social-google" onclick="window.handleSocialLogin('Google')">
                <i class="fa-brands fa-google social-icon"></i>
                <span>Login with google</span>
              </button>
            </div>

          </form>

        </div>
      </div>

    </div>
  </main>

  <!-- Master JavaScript -->
  <script src="js/script.js?v=6.8"></script>
</body>
</html>
